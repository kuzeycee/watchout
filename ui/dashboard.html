<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>WatchOut</title>

    <style>
      #app-title {
        font-family: 'Georgia', serif;
        font-size: 28px;
      }

      body {
        background: white;
        color: black;
        font-family: Arial, sans-serif;
        font-size: 15px;
        padding: 20px;
      }

      .left, .right {
        display: inline-block;
        vertical-align: top;
      }

      .right {
        margin-left: 30px;
        width: 300px;
      }

      .right table {
        width: 100%;
      }

      .right td {
        padding: 2px 0;
      }

      .right td + td {
        padding-left: 14px;
        white-space: nowrap;
      }

      #summary-tip {
        margin-top: 10px;
        line-height: 1.45;
      }

      .camera {
        width: 640px;
        height: 480px;
        background: #eee;
        border: 1px solid #999;
        color: #456;
        padding: 10px;
      }

      .camera video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scaleX(-1);
      }

      .controls {
        margin-top: 10px;
      }

      .controls label {
        margin-left: 10px;
      }

      #break-alert {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffd54f;
        border: 1px solid #c90;
        padding: 12px 24px;
        font-size: 18px;
        font-weight: bold;
      }

      #warning {
        width: 24px;
        height: 24px;
        background: red;
        border-radius: 50%;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
</head>

<body>

<h1 id="app-title">WatchOut</h1>

<br><br>

<div class="left">
    <div class="camera">blank</div>
    <div class="controls">
        <button id="start-session">Start Session</button>
        <button id="take-break" hidden>Take a Break</button>
        <button id="resume" hidden>Resume</button>
        <button id="end-session" hidden>End Session</button>
        <button id="minimize">Minimize</button>
        <label><input type="checkbox" id="sound" checked /> Sound</label>
    </div>
</div>

<div class="right">
    <table>
        <tr><td>Eyes</td><td><span id="current">open</span></td></tr>
        <tr><td>Blink score</td><td><span id="blink-score">-</span></td></tr>
        <tr><td>Time since last blink</td><td><span id="time">2.4</span> seconds</td></tr>
        <tr><td>Blinks</td><td><span id="blink">0</span></td></tr>
        <tr><td>Warnings</td><td><span id="no-of-warning">0</span></td></tr>
        <tr><td>Next break in</td><td><span id="break">20:00</span></td></tr>
    </table>

    <div id="summary" hidden>
        <h3>Session Summary</h3>
        <table>
            <tr><td>Total time</td><td><span id="summary-time">00:00</span></td></tr>
            <tr><td>Total blinks</td><td><span id="summary-blinks">0</span></td></tr>
            <tr><td>Total warnings</td><td><span id="summary-warnings">0</span></td></tr>
        </table>
        <p id="summary-tip"></p>
    </div>
</div>

<div id="warning" style="display:none"></div>
<div id="break-alert" hidden>Look 20 feet away for 20 seconds</div>

<script type="module">
    import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

    const camBox = document.querySelector('.camera');
    const startBtn = document.querySelector('#start-session');
    const breakBtn = document.querySelector('#take-break');
    const resumeBtn = document.querySelector('#resume');
    const endBtn = document.querySelector('#end-session');
    const hideBtn = document.querySelector('#minimize');
    const sound = document.querySelector('#sound');
    const eyes = document.querySelector('#current');
    const score = document.querySelector('#blink-score');
    const redDot = document.querySelector('#warning');
    const blinkTxt = document.querySelector('#blink');
    const warnTxt = document.querySelector('#no-of-warning');
    const timeTxt = document.querySelector('#time');
    const breakTxt = document.querySelector('#break');
    const breakBox = document.querySelector('#break-alert');
    const sumBox = document.querySelector('#summary');
    const sumTime = document.querySelector('#summary-time');
    const sumBlinks = document.querySelector('#summary-blinks');
    const sumWarns = document.querySelector('#summary-warnings');
    const sumTip = document.querySelector('#summary-tip');
    const breakGap = 20 * 60 * 1000;
    const restGap = 40 * 1000;

    let blinks = 0;
    let warns = 0;
    let state = 'idle';
    let startedAt = 0;
    let left = breakGap;
    let dueAt = 0;
    let tick = 0;
    let rest = 0;
    let lastBlink = 0;
    let runId = 0;
    let camId = 0;
    let dotOn = false;
    let edgeOn = false;
    let video = null;
    let stream = null;
    let landmarker = null;
    let audio = null;

    FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm')
      .then(function (vision) {
        return FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numFaces: 1,
          outputFaceBlendshapes: true
        });
      })
      .then(function (model) {
        landmarker = model;
      })
      .catch(function (err) {
        eyes.textContent = 'model error';
        console.error(err);
      });

    function fmt(ms) {
      const all = Math.floor(ms / 1000);
      const hrs = Math.floor(all / 3600);
      const mins = String(Math.floor((all % 3600) / 60)).padStart(2, '0');
      const secs = String(all % 60).padStart(2, '0');
      return hrs > 0 ? hrs + ':' + mins + ':' + secs : mins + ':' + secs;
    }

    function advise(ms, count) {
      const mins = ms / 60000;

      if (mins < 2) {
        return 'Too short to judge. Track for at least five minutes to get a reading worth trusting.';
      }

      const rate = count / mins;
      let tip = '';

      if (rate < 4) {
        tip = 'Your blink rate was very low at ' + rate.toFixed(1) + ' per minute. Eyes this dry tend to sting by the end of the day. Rest them now, and keep the 20-20-20 breaks from here on.';
      } else if (rate < 8) {
        tip = 'Your blink rate was low at ' + rate.toFixed(1) + ' per minute, which is common when reading on a screen. Blinking on purpose every so often helps more than it sounds.';
      } else if (rate < 12) {
        tip = 'Your blink rate was a little under normal at ' + rate.toFixed(1) + ' per minute. Nothing worrying, but a deliberate blink now and then would close the gap.';
      } else if (rate < 20) {
        tip = 'Your blink rate was healthy at ' + rate.toFixed(1) + ' per minute. Whatever you did in this session, keep doing it.';
      } else if (rate < 30) {
        tip = 'Your blink rate was above average at ' + rate.toFixed(1) + ' per minute. That often means your eyes are working against dryness or glare. Check the screen brightness and the air in the room.';
      } else {
        tip = 'Your blink rate was unusually high at ' + rate.toFixed(1) + ' per minute. Blinking that often can point to irritation or strain. If it carries on across sessions, it is worth raising with an optician.';
      }

      if (mins >= 90) {
        return tip + ' You also stayed at it for over an hour and a half without stopping, which is a long stretch for one sitting.';
      }

      if (mins >= 45) {
        return tip + ' This was a long session, so a proper screen-free break will do more for you than another short one.';
      }

      return tip;
    }

    function showLeft() {
      breakTxt.textContent = fmt(Math.ceil(left / 1000) * 1000);
    }

    function tickBreak() {
      left = Math.max(0, dueAt - performance.now());
      showLeft();

      if (left === 0) {
        clearInterval(tick);
        tick = 0;
        beep();

        if (window.api) {
          window.api.note(true);
        }
      }
    }

    function startRest() {
      breakBox.hidden = false;
      stopWatch();
      rest = setTimeout(endRest, restGap);
    }

    function endRest() {
      rest = 0;
      breakBox.hidden = true;
      left = breakGap;
      beep();

      if (state === 'active' && video) {
        watch();
      }

      startBreak();
    }

    function startBreak() {
      clearInterval(tick);
      breakBox.hidden = true;
      dueAt = performance.now() + left;
      tick = setInterval(tickBreak, 250);
      tickBreak();
    }

    function stopBreak() {
      if (window.api) {
        window.api.note(false);
      }

      if (rest) {
        clearTimeout(rest);
        rest = 0;
      }

      if (tick) {
        left = Math.max(0, dueAt - performance.now());
        clearInterval(tick);
        tick = 0;
      }

      breakBox.hidden = true;
      showLeft();
    }

    function syncBtns() {
      startBtn.hidden = state !== 'idle';
      breakBtn.hidden = state !== 'active';
      resumeBtn.hidden = state !== 'paused';
      endBtn.hidden = state === 'idle';
    }

    function openCam() {
      const id = ++camId;

      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function (cam) {
          if (id !== camId || state === 'idle') {
            cam.getTracks().forEach(function (track) {
              track.stop();
            });
            return;
          }

          stream = cam;

          video = document.createElement('video');
          video.srcObject = stream;
          video.autoplay = true;
          video.playsInline = true;
          video.muted = true;

          camBox.textContent = '';
          camBox.appendChild(video);

          if (state === 'active') {
            watch();
          }
        })
        .catch(function (err) {
          if (id !== camId) {
            return;
          }

          camBox.textContent = 'camera error: ' + err.name;
          state = 'idle';
          stopWatch();
          stopBreak();
          syncBtns();
        });
    }

    function closeCam() {
      camId++;

      if (stream) {
        stream.getTracks().forEach(function (track) {
          track.stop();
        });
        stream = null;
      }

      video = null;
      camBox.textContent = '';
    }

    function beep() {
      if (!sound.checked) {
        return;
      }

      if (!audio) {
        audio = new AudioContext();
      }

      if (audio.state === 'suspended') {
        audio.resume();
      }

      const osc = audio.createOscillator();
      const gain = audio.createGain();
      const at = audio.currentTime;

      osc.type = 'sine';
      osc.frequency.value = 660;

      gain.gain.setValueAtTime(0, at);
      gain.gain.linearRampToValueAtTime(0.04, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.25);

      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start(at);
      osc.stop(at + 0.26);
    }

    function warn(on) {
      redDot.style.display = on ? 'block' : 'none';

      if (window.api && on !== dotOn) {
        dotOn = on;
        window.api.dot(on);
      }
    }

    function edge(on) {
      if (on === edgeOn) {
        return;
      }

      edgeOn = on;

      if (on) {
        beep();
      }

      if (window.api) {
        window.api.near(on);
      }
    }

    function stopWatch() {
      runId++;
      eyes.textContent = '-';
      score.textContent = '-';
      warn(false);
      edge(false);
    }

    function watch() {
      const id = ++runId;
      let lastFrame = -1;
      let shut = false;
      let face = false;
      let warned = false;
      let near = false;
      lastBlink = performance.now();

      function loop() {
        if (id !== runId || !video || video.srcObject !== stream) {
          return;
        }

        if (landmarker && video.readyState >= 2 && video.currentTime !== lastFrame) {
          lastFrame = video.currentTime;
          const out = landmarker.detectForVideo(video, performance.now());

          face = out.faceBlendshapes.length > 0;

          if (face) {
            const shapes = out.faceBlendshapes[0].categories;
            const l = shapes.find(function (c) { return c.categoryName === 'eyeBlinkLeft'; }).score;
            const r = shapes.find(function (c) { return c.categoryName === 'eyeBlinkRight'; }).score;
            const now = (l + r) / 2;

            score.textContent = now.toFixed(2);
            eyes.textContent = now > 0.42 ? 'closed' : 'open';

            if (now > 0.42) {
              shut = true;
            } else if (shut) {
              shut = false;
              blinks++;
              blinkTxt.textContent = blinks;
              lastBlink = performance.now();
              warned = false;
              warn(false);
            }

            const pts = out.faceLandmarks[0];

            if (pts && video.videoWidth) {
              const a = pts[234];
              const b = pts[454];
              const dx = (a.x - b.x) * video.videoWidth;
              const dy = (a.y - b.y) * video.videoHeight;
              const span = Math.hypot(dx, dy) / video.videoWidth;

              if (span > 0.40) {
                near = true;
              } else if (span < 0.34) {
                near = false;
              }

              edge(near);
            }
          } else {
            eyes.textContent = 'no face';
            score.textContent = '-';
            shut = false;
          }
        }

        if (!face) {
          lastBlink = performance.now();
          warned = false;
          warn(false);
          near = false;
          edge(false);
        }

        const dry = performance.now() - lastBlink;
        timeTxt.textContent = (dry / 1000).toFixed(1);

        if (!warned && dry >= 8000) {
          warned = true;
          warn(true);
          beep();
          warns++;
          warnTxt.textContent = warns;
        }

        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', function () {
      blinks = 0;
      warns = 0;
      left = breakGap;
      startedAt = performance.now();
      lastBlink = startedAt;

      blinkTxt.textContent = blinks;
      warnTxt.textContent = warns;
      timeTxt.textContent = '0.0';
      sumBox.hidden = true;

      state = 'active';
      syncBtns();
      startBreak();
      camBox.textContent = 'opening camera...';
      openCam();
    });

    breakBtn.addEventListener('click', function () {
      state = 'paused';
      stopWatch();
      stopBreak();

      lastBlink = performance.now();
      left = breakGap;
      timeTxt.textContent = '0.0';
      showLeft();

      syncBtns();
    });

    resumeBtn.addEventListener('click', function () {
      state = 'active';
      syncBtns();
      startBreak();

      if (video) {
        watch();
      }
    });

    endBtn.addEventListener('click', function () {
      const ran = performance.now() - startedAt;

      state = 'idle';
      stopWatch();
      stopBreak();
      closeCam();
      syncBtns();

      sumTime.textContent = fmt(ran);
      sumBlinks.textContent = blinks;
      sumWarns.textContent = warns;
      sumTip.textContent = advise(ran, blinks);
      sumBox.hidden = false;
    });

    if (window.api) {
      window.api.onRest(startRest);
    }

    hideBtn.addEventListener('click', function () {
      if (window.api) {
        window.api.hide();
      }
    });

    syncBtns();
</script>

</body>
</html>
