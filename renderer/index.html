<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>WatchOut</title>

    <style>
        #app-title {
        font-family: 'Georgia', serif;
        font-size: 28px;
        }
      body {
        background: white;
        color: black;
        font-family: Arial, sans-serif;
        font-size: 15px;
        padding: 20px;
      }

      .left, .right {
        display: inline-block;
        vertical-align: top;
      }

      .right {
        margin-left: 30px;
      }

      .camera {
        width: 640px;
        height: 480px;
        background: #bfd;
        border: 1px solid #999;
        color: #456;
        padding: 10px;
      }

      .camera video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scaleX(-1);
      }

      .controls {
        margin-top: 10px;
      }

      #break-alert {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffd54f;
        border: 1px solid #c90;
        padding: 12px 24px;
        font-size: 18px;
        font-weight: bold;
      }

      #warning {
        width: 24px;
        height: 24px;
        background: red;
        border-radius: 50%;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
</head>

<body>

<h1 id="app-title">WatchOut</h1>

<br><br>

<div class="left">
    <div class="camera">blank</div>
    <div class="controls">
        <button id="start-session">Start Session</button>
        <button id="take-break" hidden>Take a Break</button>
        <button id="resume" hidden>Resume</button>
        <button id="end-session" hidden>End Session</button>
    </div>
</div>

<div class="right">
    <p>EYES: <span id="current">open</span></p>
    <p>Blink Score: <span id="blink-score">-</span></p>
    <p>Time has been after the last blink: <span id="time">2.4</span> seconds</p>
    <p>Blink no until now: <span id="blink">0</span></p>
    <p>warning no until now: <span id="no-of-warning">0</span></p>
    <p>After break: <span id="break">20:00</span></p>

    <div id="summary" hidden>
        <h3>Session Summary</h3>
        <p>Total time: <span id="summary-time">00:00</span></p>
        <p>Total blinks: <span id="summary-blinks">0</span></p>
        <p>Total warnings: <span id="summary-warnings">0</span></p>
    </div>
</div>

<div id="warning" style="display:none"></div>
<div id="break-alert" hidden>Time for a break!</div>

<script type="module">
    import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

    const camBox = document.querySelector('.camera');
    const startButton = document.querySelector('#start-session');
    const breakButton = document.querySelector('#take-break');
    const resumeButton = document.querySelector('#resume');
    const endButton = document.querySelector('#end-session');
    const eyesSpan = document.querySelector('#current');
    const blinkScoreSpan = document.querySelector('#blink-score');
    const warningCircle = document.querySelector('#warning');
    const blinkSpan = document.querySelector('#blink');
    const warningCountSpan = document.querySelector('#no-of-warning');
    const timeSpan = document.querySelector('#time');
    const breakSpan = document.querySelector('#break');
    const breakAlert = document.querySelector('#break-alert');
    const summaryBox = document.querySelector('#summary');
    const summaryTimeSpan = document.querySelector('#summary-time');
    const summaryBlinksSpan = document.querySelector('#summary-blinks');
    const summaryWarningsSpan = document.querySelector('#summary-warnings');
    const breakInterval = 20 * 60 * 1000;
    let blinkCount = 0;
    let warningCount = 0;
    let sessionState = 'idle';
    let sessionStart = 0;
    let breakRemaining = breakInterval;
    let breakDeadline = 0;
    let breakTimerId = 0;
    let lastBlinkTime = 0;
    let loopId = 0;
    let camRequest = 0;
    let video = null;
    let stream = null;
    let faceLandmarker = null;

    FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm')
      .then(function (vision) {
        return FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numFaces: 1,
          outputFaceBlendshapes: true
        });
      })
      .then(function (landmarker) {
        faceLandmarker = landmarker;
      })
      .catch(function (err) {
        eyesSpan.textContent = 'model error';
        console.error(err);
      });

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      return hours > 0 ? hours + ':' + minutes + ':' + seconds : minutes + ':' + seconds;
    }

    function updateBreakSpan() {
      breakSpan.textContent = formatTime(Math.ceil(breakRemaining / 1000) * 1000);
    }

    function tickBreakTimer() {
      breakRemaining = Math.max(0, breakDeadline - performance.now());
      updateBreakSpan();

      if (breakRemaining === 0) {
        clearInterval(breakTimerId);
        breakTimerId = 0;
        breakAlert.hidden = false;
      }
    }

    function startBreakTimer() {
      clearInterval(breakTimerId);
      breakAlert.hidden = true;
      breakDeadline = performance.now() + breakRemaining;
      breakTimerId = setInterval(tickBreakTimer, 250);
      tickBreakTimer();
    }

    function stopBreakTimer() {
      if (breakTimerId) {
        breakRemaining = Math.max(0, breakDeadline - performance.now());
        clearInterval(breakTimerId);
        breakTimerId = 0;
      }
      breakAlert.hidden = true;
      updateBreakSpan();
    }

    function updateButtons() {
      startButton.hidden = sessionState !== 'idle';
      breakButton.hidden = sessionState !== 'active';
      resumeButton.hidden = sessionState !== 'paused';
      endButton.hidden = sessionState === 'idle';
    }

    function openCam() {
      const request = ++camRequest;

      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function (newStream) {
          if (request !== camRequest || sessionState === 'idle') {
            newStream.getTracks().forEach(function (track) {
              track.stop();
            });
            return;
          }

          stream = newStream;

          video = document.createElement('video');
          video.srcObject = stream;
          video.autoplay = true;
          video.playsInline = true;
          video.muted = true;

          camBox.textContent = '';
          camBox.appendChild(video);

          if (sessionState === 'active') {
            detectEyes();
          }
        })
        .catch(function (err) {
          if (request !== camRequest) {
            return;
          }

          camBox.textContent = 'camera error: ' + err.name;
          sessionState = 'idle';
          stopDetection();
          stopBreakTimer();
          updateButtons();
        });
    }

    function closeCam() {
      camRequest++;

      if (stream) {
        stream.getTracks().forEach(function (track) {
          track.stop();
        });
        stream = null;
      }

      video = null;
      camBox.textContent = 'cam off';
    }

    function stopDetection() {
      loopId++;
      eyesSpan.textContent = '-';
      blinkScoreSpan.textContent = '-';
      warningCircle.style.display = 'none';
    }

    function detectEyes() {
      const id = ++loopId;
      let lastVidTime = -1;
      let eyesClosed = false;
      let faceVisible = false;
      let warningShown = false;
      lastBlinkTime = performance.now();

      function loop() {
        if (id !== loopId || !video || video.srcObject !== stream) {
          return;
        }

        if (faceLandmarker && video.readyState >= 2 && video.currentTime !== lastVidTime) {
          lastVidTime = video.currentTime;
          const result = faceLandmarker.detectForVideo(video, performance.now());

          faceVisible = result.faceBlendshapes.length > 0;

          if (faceVisible) {
            const categories = result.faceBlendshapes[0].categories;
            const blinkLeft = categories.find(function (c) { return c.categoryName === 'eyeBlinkLeft'; }).score;
            const blinkRight = categories.find(function (c) { return c.categoryName === 'eyeBlinkRight'; }).score;

            const blinkScore = (blinkLeft + blinkRight) / 2;

            blinkScoreSpan.textContent = blinkScore.toFixed(2);
            eyesSpan.textContent = blinkScore > 0.5 ? 'closed' : 'open';

            if (blinkScore > 0.5) {
              eyesClosed = true;
            } else if (eyesClosed) {
              eyesClosed = false;
              blinkCount++;
              blinkSpan.textContent = blinkCount;
              lastBlinkTime = performance.now();
              warningShown = false;
              warningCircle.style.display = 'none';
            }
          } else {
            eyesSpan.textContent = 'no face';
            blinkScoreSpan.textContent = '-';
            eyesClosed = false;
          }
        }

        if (!faceVisible) {
          lastBlinkTime = performance.now();
          warningShown = false;
          warningCircle.style.display = 'none';
        }

        const noBlinkTime = performance.now() - lastBlinkTime;
        timeSpan.textContent = (noBlinkTime / 1000).toFixed(1);

        if (!warningShown && noBlinkTime >= 4000) {
          warningShown = true;
          warningCircle.style.display = 'block';
          warningCount++;
          warningCountSpan.textContent = warningCount;
        }

        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    }

    startButton.addEventListener('click', function () {
      blinkCount = 0;
      warningCount = 0;
      breakRemaining = breakInterval;
      sessionStart = performance.now();
      lastBlinkTime = sessionStart;

      blinkSpan.textContent = blinkCount;
      warningCountSpan.textContent = warningCount;
      timeSpan.textContent = '0.0';
      summaryBox.hidden = true;

      sessionState = 'active';
      updateButtons();
      startBreakTimer();
      camBox.textContent = 'opening camera...';
      openCam();
    });

    breakButton.addEventListener('click', function () {
      sessionState = 'paused';
      stopDetection();
      stopBreakTimer();

      lastBlinkTime = performance.now();
      breakRemaining = breakInterval;
      timeSpan.textContent = '0.0';
      updateBreakSpan();

      updateButtons();
    });

    resumeButton.addEventListener('click', function () {
      sessionState = 'active';
      updateButtons();
      startBreakTimer();

      if (video) {
        detectEyes();
      }
    });

    endButton.addEventListener('click', function () {
      const duration = performance.now() - sessionStart;

      sessionState = 'idle';
      stopDetection();
      stopBreakTimer();
      closeCam();
      updateButtons();

      summaryTimeSpan.textContent = formatTime(duration);
      summaryBlinksSpan.textContent = blinkCount;
      summaryWarningsSpan.textContent = warningCount;
      summaryBox.hidden = false;
    });

    updateButtons();
</script>

</body>
</html>
