<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>WatchOut</title>

    <style>
        #app-title {
        font-family: 'Georgia', serif;
        font-size: 28px;
        }
      body {
        background: white;
        color: black;
        font-family: Arial, sans-serif;
        font-size: 15px;
        padding: 20px;
      }

      .left, .right {
        display: inline-block;
        vertical-align: top;
      }

      .right {
        margin-left: 30px;
      }

      .camera {
        width: 640px;
        height: 480px;
        background: #bfd;
        border: 1px solid #999;
        color: #456;
        padding: 10px;
      }

      .camera video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scaleX(-1);
      }

      #stop-camera {
        margin-top: 10px;
      }

      #warning {
        width: 200px;
        height: 200px;
        background: red;
        border-radius: 50%;
        position: fixed;
        top: 200px;
        left: 400px;
        color: white;
        padding: 90px 0 0 0;
        text-align: center;
      }
    </style>
</head>

<body>

<h1 id="app-title">WatchOut</h1>

<br><br>

<div class="left">
    <div class="camera">blank</div>
    <button id="stop-camera" disabled>Close Camera</button>
</div>

<div class="right">
    <p>EYES: <span id="current">open</span></p>
    <p>EAR: <span id="ear">0.31</span></p>
    <p>Time has been after the last blink: <span id="time">2.4</span> seconds</p>
    <p>Blink no until now: <span id="blink">0</span></p>
    <p>warning no until now: <span id="no-of-warning">0</span></p>
    <p>After break: <span id="break">20:00</span></p>
</div>

<div id="warning" style="display:none">OPEN YOUR EYES</div>

<script type="module">
    import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

    const camBox = document.querySelector('.camera');
    const camButton = document.querySelector('#stop-camera');
    const eyesSpan = document.querySelector('#current');
    let stream = null;
    let faceLandmarker = null;

    FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm')
      .then(function (vision) {
        return FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numFaces: 1,
          outputFaceBlendshapes: true
        });
      })
      .then(function (landmarker) {
        faceLandmarker = landmarker;
      })
      .catch(function (err) {
        eyesSpan.textContent = 'model error';
        console.error(err);
      });

    function openCam() {
      camButton.disabled = true;

      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function (newStream) {
          stream = newStream;

          const video = document.createElement('video');
          video.srcObject = stream;
          video.autoplay = true;
          video.playsInline = true;
          video.muted = true;

          camBox.textContent = '';
          camBox.appendChild(video);
          detectEyes(video);

          camButton.textContent = 'Close Camera';
          camButton.disabled = false;
        })
        .catch(function (err) {
          camBox.textContent = 'camera error: ' + err.name;
          camButton.textContent = 'Open Camera';
          camButton.disabled = false;
        });
    }

    function closeCam() {
      stream.getTracks().forEach(function (track) {
        track.stop();
      });
      stream = null;

      camBox.textContent = 'cam off';
      camButton.textContent = 'Open Camera';
    }

    function detectEyes(video) {
      let lastVidTime = -1;

      function loop() {
        if (video.srcObject !== stream) {
          eyesSpan.textContent = '-';
          return;
        }

        if (faceLandmarker && video.readyState >= 2 && video.currentTime !== lastVidTime) {
          lastVidTime = video.currentTime;
          const result = faceLandmarker.detectForVideo(video, performance.now());

          if (result.faceBlendshapes.length > 0) {
            const categories = result.faceBlendshapes[0].categories;
            const blinkLeft = categories.find(function (c) { return c.categoryName === 'eyeBlinkLeft'; }).score;
            const blinkRight = categories.find(function (c) { return c.categoryName === 'eyeBlinkRight'; }).score;

            eyesSpan.textContent = (blinkLeft + blinkRight) / 2 > 0.5 ? 'closed' : 'open';
          } else {
            eyesSpan.textContent = 'no face';
          }
        }

        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    }

    camButton.addEventListener('click', function () {
      if (stream) {
        closeCam();
      } else {
        openCam();
      }
    });

    openCam();
</script>

</body>
</html>
